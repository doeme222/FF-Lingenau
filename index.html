<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Feuerwehrkarte – Fix</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="topbar">
    <button id="locBtn">📍 Meine Position</button>
    <button id="addBtn">➕ Hydrant setzen</button>
    <select id="layerSelect">
      <option value="toCheck">Hydranten zur Überprüfung</option>
      <option value="confirmed">Bestätigte Hydranten</option>
    </select>
    <input id="search" placeholder="Suchen..." style="padding:6px;border-radius:6px;border:1px solid #ccc"/>
    <button id="exportBtn">⬇ Export</button>
    <button id="importBtn">⬆ Import</button>
    <input type="file" id="fileInput" accept=".geojson,.json" style="display:none"/>
  </div>

  <div id="panel">
    <h3>Hydranten</h3>
    <div style="margin-bottom:8px"><strong>Zur Überprüfung</strong></div>
    <div id="listToCheck"></div>
    <div style="margin-top:12px"><strong>Bestätigt</strong></div>
    <div id="listConfirmed"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
